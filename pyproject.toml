[project]
name = "coding-agent"
version = "0.1.0"
description = "Multi-agent LangGraph coding agent with a sandboxed Docker executor"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "langgraph",
  "langchain-groq",
  "pydantic",
  "pydantic-settings",
  "typer",
  "fastapi",
  "uvicorn",
  "langfuse",
]

[dependency-groups]
dev = ["pytest", "pytest-timeout", "ruff"]

[project.scripts]
agent = "coding_agent.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/coding_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # lets tests import shared fakes as tests.graph.fakes
timeout = 180
norecursedirs = ["tests/fixtures/tasks"]  # sample eval tasks hold hidden tests, not suite tests
markers = ["docker: tests that need a running Docker daemon and the sandbox image"]

[tool.ruff]
line-length = 100
extend-exclude = ["tests/fixtures/tasks"]
